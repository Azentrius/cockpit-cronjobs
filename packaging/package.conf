# What tools/build-packages.sh needs to know about this package (sourced by sh).
# SPDX-License-Identifier: Apache-2.0

NAME=cockpit-cronjobs
SUMMARY="Cockpit page for cron jobs and systemd timers"
DESCRIPTION="Every cron job and systemd timer on the server in one place, with a timeline of the next 24 hours. Safe edits of the root crontab and those of other users with backups, optional recording of exit code, duration and output of runs, missed runs and runs from cron's log, run now with live output, conversion of cron jobs to systemd timers and back, and a status for the Azentrius Status Board."
HOMEPAGE=https://github.com/Azentrius/cockpit-cronjobs
MAINTAINER="Azentrius <support@azentrius.com>"
LICENSE="Apache-2.0 AND OFL-1.1 AND CC-BY-4.0"

# One dependency per line.
DEB_DEPENDS="cockpit-bridge
cron | cron-daemon"
RPM_REQUIRES="cockpit-bridge
(cronie or cron)"

# What the package owns below the staged root (directories are taken whole).
FILES="/usr/share/cockpit/cronjobs
/usr/lib/cockpit-cronjobs
/usr/lib/systemd/system/cockpit-cronjobs-status.service
/usr/lib/systemd/system/cockpit-cronjobs-status.timer
/usr/share/metainfo/de.azentrius.cronjobs.metainfo.xml
/usr/share/doc/cockpit-cronjobs"
