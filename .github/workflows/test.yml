name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Unit tests (crontab logic, systemd conversion against systemd-analyze, run recorder with dash and bash)
        run: make check
      - name: Package (with LICENSE and NOTICE, built twice to the same bytes) and changelog for the current version
        run: |
          make package
          version=$(sed -n 's/^ *const VERSION = "\(.*\)";/\1/p' src/app.js)
          archive=cockpit-cronjobs-$version.tar.gz
          for f in LICENSE NOTICE; do
            tar -xzOf "$archive" "cronjobs/$f" | cmp - "$f"
            tar -tvzf "$archive" "cronjobs/$f" | grep -q '^-rw-r--r-- 0/0 '
            grep -qx "$(sha256sum < "$f" | cut -d ' ' -f 1)  cronjobs/$f" SHA256SUMS
          done
          sha256sum "$archive" > "$RUNNER_TEMP/archive.sha256"
          rm -f "$archive" SHA256SUMS
          make package > /dev/null
          sha256sum -c "$RUNNER_TEMP/archive.sha256"
          tools/release-notes.sh "$version" > /dev/null || { echo "::error::CHANGELOG.md has no section for $version"; exit 1; }
      - name: Packages (.deb, .rpm) with valid AppStream data, built twice to the same bytes
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends rpm appstream > /dev/null
          appstreamcli validate --no-net packaging/*.metainfo.xml
          make packages
          (cd dist && sha256sum *.deb *.rpm) > first.sha256
          rm -rf dist && make packages > /dev/null
          (cd dist && sha256sum -c ../first.sha256)
      - name: Install the .deb on Debian and the .rpm on Fedora, and write the status there
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" debian:13 sh -ec '
            apt-get update -qq
            apt-get install -y -qq /dist/*.deb > /dev/null
            test -x /usr/share/cockpit/cronjobs/cockpit-cronjobs-run
            test -f /usr/share/metainfo/de.azentrius.cronjobs.metainfo.xml
            dpkg -L cockpit-cronjobs | grep -q /usr/share/cockpit/cronjobs/manifest.json
            s=/usr/lib/cockpit-cronjobs/cronjobs-status
            test -x $s
            test -f /usr/lib/systemd/system/cockpit-cronjobs-status.service
            test -f /usr/lib/systemd/system/cockpit-cronjobs-status.timer
            $s status --lang en | grep -q "\"state\":\"none\""
            $s write
            test "$(stat -c %a /var/lib/cockpit-cronjobs/status.de.json)" = 644
            $s status --lang de | grep -q "\"summary\":\"In den Crontabs von root und anderen Benutzern gibt es keine Jobs.\""'
          docker run --rm -v "$PWD/dist:/dist:ro" fedora:43 sh -ec '
            dnf install -y -q /dist/*.rpm
            rpm -V cockpit-cronjobs
            test -f /usr/share/cockpit/cronjobs/manifest.json
            s=/usr/lib/cockpit-cronjobs/cronjobs-status
            $s write
            $s status --lang en | grep -q "\"state\":\"ok\""'
      - name: Check tools (pinned in test/requirements.txt) and the browser
        run: |
          pip install -r test/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Lint (shellcheck, ruff)
        run: make lint
      - name: Browser tests
        run: make check-ui
      - name: Keep screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: test/shots/
      - name: Screenshots for the README (test/docs_shots.py; make docs-shots puts them into docs/)
        run: python test/docs_shots.py test/docs-shots
      - name: Keep the screenshots for the README
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-screenshots
          path: test/docs-shots/

  # The main flows against a real Cockpit, root's real crontab and a running cron daemon.
  # Destructive, which is what the runner's throwaway VM is for (see test/e2e_cockpit.py).
  # Twice: with the Cockpit of Ubuntu 24.04 itself (314), which a server keeps unless it is set up
  # otherwise, and with the one from the backports, as Cockpit recommends for Ubuntu. The second
  # time cron logs more (-L 15: also the end, failures and the job's PID), as an admin may set it.
  e2e-cockpit:
    name: e2e (Cockpit from the ${{ matrix.cockpit }}${{ matrix.cron-opts && format(', cron {0}', matrix.cron-opts) || '' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - cockpit: archive
            cron-opts: ""
          - cockpit: backports
            cron-opts: "-L 15"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Cockpit and cron
        env:
          COCKPIT: ${{ matrix.cockpit }}
          CRON_OPTS: ${{ matrix.cron-opts }}
        run: |
          . /etc/os-release
          sudo apt-get update
          if [ "$COCKPIT" = backports ]; then set -- -t "$VERSION_CODENAME-backports"; else set --; fi
          sudo apt-get install -y --no-install-recommends "$@" cockpit-ws cockpit-bridge cockpit-system
          sudo apt-get install -y --no-install-recommends cron
          if [ -n "$CRON_OPTS" ]; then
            sudo mkdir -p /etc/systemd/system/cron.service.d
            printf '[Service]\nEnvironment="EXTRA_OPTS=%s"\n' "$CRON_OPTS" |
              sudo tee /etc/systemd/system/cron.service.d/options.conf > /dev/null
            sudo systemctl daemon-reload
          fi
          sudo systemctl restart cron
          args=$(ps -o args= -p "$(systemctl show -p MainPID --value cron)")
          echo "cron: $args"
          case "$args " in *" -P${CRON_OPTS:+ $CRON_OPTS} "*) ;; *) echo "::error::cron runs without its options"; exit 1;; esac
          sudo ln -sfn "$GITHUB_WORKSPACE/src" /usr/share/cockpit/cronjobs
          # The status for the Status Board as the package installs it; the test starts its unit.
          sudo install -D -m 755 status/cronjobs-status /usr/lib/cockpit-cronjobs/cronjobs-status
          sudo install -m 644 status/cockpit-cronjobs-status.service status/cockpit-cronjobs-status.timer /usr/lib/systemd/system/
          sudo systemctl daemon-reload
          dpkg-query -W cockpit-ws cockpit-bridge cron
      - name: Check tools (pinned in test/requirements.txt) and the browser
        run: |
          pip install -r test/requirements.txt
          python -m playwright install --with-deps chromium
          echo "PLAYWRIGHT_BROWSERS_PATH=$HOME/.cache/ms-playwright" >> "$GITHUB_ENV"
      - name: Start Cockpit as root, without login
        run: |
          sudo /usr/lib/cockpit/cockpit-ws --no-tls --port 9091 --address 127.0.0.1 --local-session=cockpit-bridge \
            > "$RUNNER_TEMP/cockpit-ws.log" 2>&1 &
          for i in $(seq 100); do
            if (exec 3<>/dev/tcp/127.0.0.1/9091) 2>/dev/null; then exit 0; fi
            sleep 0.2
          done
          cat "$RUNNER_TEMP/cockpit-ws.log"
          exit 1
      - name: End-to-end test (as root)
        run: |
          sudo env PLAYWRIGHT_BROWSERS_PATH="$PLAYWRIGHT_BROWSERS_PATH" CRONJOBS_E2E_DESTRUCTIVE=1 \
            "$(command -v python)" test/e2e_cockpit.py
      - name: Logs
        if: failure()
        run: |
          cat "$RUNNER_TEMP/cockpit-ws.log" || true
          sudo journalctl -u cron --no-pager -n 50 || true
          sudo journalctl -u cockpit-cronjobs-status --no-pager -n 30 || true
          sudo crontab -l -u root || true
          sudo ls -laR /var/lib/cockpit-cronjobs || true
      - name: Keep screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-screenshots-${{ matrix.cockpit }}
          path: test/shots/

  # The required check: green only when the end-to-end test passed with both. It runs even when
  # one of them failed, since a check that is skipped would count as passed.
  e2e:
    needs: e2e-cockpit
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: End-to-end test with both
        env:
          RESULT: ${{ needs.e2e-cockpit.result }}
        run: |
          echo "e2e-cockpit: $RESULT"
          test "$RESULT" = success
