name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Unit tests (crontab logic, systemd conversion against systemd-analyze, run recorder with dash and bash)
        run: make check
      - name: Package and changelog for the current version
        run: |
          make package
          version=$(sed -n 's/^ *const VERSION = "\(.*\)";/\1/p' src/app.js)
          tools/release-notes.sh "$version" > /dev/null || { echo "::error::CHANGELOG.md has no section for $version"; exit 1; }
      - name: Check tools (pinned in test/requirements.txt) and the browser
        run: |
          pip install -r test/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Lint (shellcheck, ruff)
        run: make lint
      - name: Browser tests
        run: make check-ui
      - name: Keep screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: test/shots/
