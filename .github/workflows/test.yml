name: test

# A pull request runs once (pull_request), a push only on main; any other branch by hand
# (Actions › test › Run workflow).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# The release the upgrade test (test/e2e/upgrade.sh) installs first: 2.10.2, the last one before the
# changes for cronie and SELinux (its status unit fails under SELinux enforcing), as its GitHub
# release serves it, pinned by SHA-256 (test/e2e/release-asset.sh also checks them against the
# release's SHA256SUMS).
env:
  PREVIOUS_TAG: v2.10.2
  PREVIOUS_DEB: cockpit-cronjobs_2.10.2-1_all.deb
  PREVIOUS_DEB_SHA256: f92f1736afd8438dc5eefd8a0de213f04c1f4d287efef7f7247584e9df8e5e2c
  PREVIOUS_RPM: cockpit-cronjobs-2.10.2-1.noarch.rpm
  PREVIOUS_RPM_SHA256: 7476b1008c734f44e5f53c58b12838468fc23e2c0091a44a9770dd1d55a817f0

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Unit tests (crontab logic, systemd conversion against systemd-analyze, run recorder with dash and bash)
        run: make check
      - name: Package (with LICENSE and NOTICE, built twice to the same bytes) and changelog for the current version
        run: |
          make package
          version=$(sed -n 's/^ *const VERSION = "\(.*\)";/\1/p' src/app.js)
          archive=cockpit-cronjobs-$version.tar.gz
          for f in LICENSE NOTICE; do
            tar -xzOf "$archive" "cronjobs/$f" | cmp - "$f"
            tar -tvzf "$archive" "cronjobs/$f" | grep -q '^-rw-r--r-- 0/0 '
            grep -qx "$(sha256sum < "$f" | cut -d ' ' -f 1)  cronjobs/$f" SHA256SUMS
          done
          sha256sum "$archive" > "$RUNNER_TEMP/archive.sha256"
          rm -f "$archive" SHA256SUMS
          make package > /dev/null
          sha256sum -c "$RUNNER_TEMP/archive.sha256"
          tools/release-notes.sh "$version" > /dev/null || { echo "::error::CHANGELOG.md has no section for $version"; exit 1; }
      - name: Packages (.deb, .rpm) with valid AppStream data, built twice to the same bytes
        run: |
          sudo sh tools/apt-update.sh
          sudo apt-get install -y -qq --no-install-recommends rpm appstream > /dev/null
          appstreamcli validate --no-net packaging/*.metainfo.xml
          make packages
          (cd dist && sha256sum *.deb *.rpm) > first.sha256
          rm -rf dist && make packages > /dev/null
          (cd dist && sha256sum -c ../first.sha256)
      - name: Install the .deb on Debian and the .rpm on Fedora, and write the status there
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" debian:13 sh -ec '
            apt-get -o Acquire::http::Timeout=20 -o Acquire::Retries=3 update -qq
            apt-get -o Acquire::http::Timeout=20 -o Acquire::Retries=3 install -y -qq /dist/*.deb > /dev/null
            test -x /usr/share/cockpit/cronjobs/cockpit-cronjobs-run
            test -f /usr/share/metainfo/de.azentrius.cronjobs.metainfo.xml
            dpkg -L cockpit-cronjobs | grep -q /usr/share/cockpit/cronjobs/manifest.json
            s=/usr/lib/cockpit-cronjobs/cronjobs-status
            test -x $s
            test -f /usr/lib/systemd/system/cockpit-cronjobs-status.service
            test -f /usr/lib/systemd/system/cockpit-cronjobs-status.timer
            $s status --lang en | grep -q "\"state\":\"none\""
            $s write
            test "$(stat -c %a /var/lib/cockpit-cronjobs/status.de.json)" = 644
            $s status --lang de | grep -q "\"summary\":\"In den Crontabs von root und anderen Benutzern gibt es keine Jobs.\""'
          docker run --rm -v "$PWD/dist:/dist:ro" -v "$PWD/tools/dnf.sh:/dnf.sh:ro" fedora:43 sh -ec '
            sh /dnf.sh install -y -q /dist/*.rpm
            rpm -V cockpit-cronjobs
            test -f /usr/share/cockpit/cronjobs/manifest.json
            s=/usr/lib/cockpit-cronjobs/cronjobs-status
            $s write
            $s status --lang en | grep -q "\"state\":\"ok\""'
      - name: Check tools (pinned in test/requirements.txt)
        run: pip install -r test/requirements.txt
      # Only the browser, from Playwright's CDN (seconds). Its system packages (--with-deps: fonts,
      # xvfb) come by apt from the Ubuntu mirror, which once took twelve minutes for them and cut
      # this job off at its time limit (PR #85). The runner image brings what Chromium needs (it
      # has Google Chrome); the browser tests show if anything is missing. Each try gets four
      # minutes, a hung one a second try.
      - name: Browser (Chromium from Playwright's CDN, two tries)
        timeout-minutes: 10
        run: |
          for try in 1 2; do
            timeout --kill-after=10s 4m python -m playwright install chromium && exit 0
            echo "::warning::playwright install failed or hung (try $try)"
          done
          exit 1
      - name: Lint (shellcheck, ruff)
        run: make lint
      - name: Browser tests
        run: make check-ui
      - name: Keep screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: test/shots/
      - name: Screenshots for the README (test/docs_shots.py; make docs-shots puts them into docs/)
        run: python test/docs_shots.py test/docs-shots
      - name: Keep the screenshots for the README
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-screenshots
          path: test/docs-shots/

  # The .rpm on the RHEL rebuilds Rocky Linux and AlmaLinux, 9 and 10, beyond the test job's
  # Debian 13 and Fedora 43: installed with the distribution's own dependencies (the versions it
  # took are printed), the status as the board reads it before and after a write, the removal
  # with the status files. No Cockpit, cron daemon or systemd runs there, so an installed package
  # is not yet a tested system.
  # dnf runs through tools/dnf.sh, with time limits and three tries: on AlmaLinux the first dnf
  # install of a job once took almost 14 minutes, and once ran until the job's time limit.
  install:
    name: install (${{ matrix.image }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image: ["rockylinux/rockylinux:9", "rockylinux/rockylinux:10", "almalinux:9", "almalinux:10"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Packages
        run: |
          sudo sh tools/apt-update.sh
          sudo apt-get install -y -qq --no-install-recommends rpm > /dev/null
          make packages
      - name: Install, check and remove on ${{ matrix.image }}
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" -v "$PWD/tools/dnf.sh:/dnf.sh:ro" "$IMAGE" sh -ec '
            . /etc/os-release
            echo "$PRETTY_NAME"
            sh /dnf.sh install -y -q /dist/*.rpm
            rpm -q cockpit-bridge cronie
            rpm -V cockpit-cronjobs
            test -f /usr/share/cockpit/cronjobs/manifest.json
            test -x /usr/share/cockpit/cronjobs/cockpit-cronjobs-run
            test -f /usr/share/metainfo/de.azentrius.cronjobs.metainfo.xml
            test -f /usr/lib/systemd/system/cockpit-cronjobs-status.service
            test -f /usr/lib/systemd/system/cockpit-cronjobs-status.timer
            s=/usr/lib/cockpit-cronjobs/cronjobs-status
            test -x $s
            $s status --lang en | grep -q "\"state\":\"none\""
            $s write
            test "$(stat -c %a /var/lib/cockpit-cronjobs/status.json)" = 644
            test "$(stat -c %a /var/lib/cockpit-cronjobs/status.de.json)" = 644
            $s status --lang en | grep -q "^{\"schema\":1,\"addon\":\"cronjobs\","
            $s status --lang en | grep -oE "\"state\":\"[a-z]+\",\"summary\":\"[^\"]*\"" | head -n 1
            dnf remove -y -q cockpit-cronjobs
            test ! -e /usr/share/cockpit/cronjobs
            test ! -e /usr/lib/cockpit-cronjobs
            test ! -e /var/lib/cockpit-cronjobs/status.json'

  # The update from the previous release (PREVIOUS_* above) on this throw-away runner, with Debian's
  # cron and the .deb (test/e2e/upgrade.sh; the same test runs with cronie and the .rpm in job
  # e2e-el): that release set up as on its page, with jobs of root and of another user that record
  # their runs, and its status unit; then the package of this build over it with apt. Crontabs,
  # recorded runs, the run recorder and the status timer stay; the status counts the failed jobs
  # for a user without rights; cron goes on recording; removing the package leaves the crontabs,
  # the runs and the run recorder. The steps and the raw answers are in the artifact
  # upgrade-ubuntu.
  upgrade:
    name: upgrade (ubuntu-24.04, cron)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The package of this build, cron and Cockpit's bridge
        run: |
          sudo sh tools/apt-update.sh
          sudo apt-get install -y -qq --no-install-recommends rpm cron cockpit-bridge > /dev/null
          make packages
      - name: The .deb of the previous release (test/e2e/release-asset.sh)
        run: sh test/e2e/release-asset.sh "$GITHUB_REPOSITORY" "$PREVIOUS_TAG" "$PREVIOUS_DEB" "$PREVIOUS_DEB_SHA256" previous
      - name: The previous release, set up as on its page, and its status unit (test/e2e/upgrade.sh old)
        run: sudo env OUT="$PWD/upgrade-session" sh test/e2e/upgrade.sh old "previous/$PREVIOUS_DEB"
      - name: This build over it (test/e2e/upgrade.sh new)
        run: sudo env OUT="$PWD/upgrade-session" sh test/e2e/upgrade.sh new dist/*.deb
      - name: The package removed (test/e2e/upgrade.sh remove)
        run: sudo env OUT="$PWD/upgrade-session" sh test/e2e/upgrade.sh remove
      - name: Report and logs
        if: always()
        run: |
          # The script ran as root: the folder is root's until it is handed back.
          sudo mkdir -p upgrade-session
          sudo chown -R "$(id -u)" upgrade-session
          [ ! -f upgrade-session/report.md ] || cat upgrade-session/report.md >> "$GITHUB_STEP_SUMMARY"
          sudo journalctl --no-pager -n 500 -u cron -u cockpit-cronjobs-status > upgrade-session/journal.txt 2>&1 || true
      - name: Keep the report and the logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upgrade-ubuntu
          path: upgrade-session/

  # The main flows against a real Cockpit, root's real crontab and a running cron daemon.
  # Destructive, which is what the runner's throwaway VM is for (see test/e2e_cockpit.py).
  # Twice: with the Cockpit of Ubuntu 24.04 itself (314), which a server keeps unless it is set up
  # otherwise, and with the one from the backports, as Cockpit recommends for Ubuntu. The second
  # time cron logs more (-L 15: also the end, failures and the job's PID), as an admin may set it.
  e2e-cockpit:
    name: e2e (Cockpit from the ${{ matrix.cockpit }}${{ matrix.cron-opts && format(', cron {0}', matrix.cron-opts) || '' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - cockpit: archive
            cron-opts: ""
          - cockpit: backports
            cron-opts: "-L 15"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install Cockpit and cron
        env:
          COCKPIT: ${{ matrix.cockpit }}
          CRON_OPTS: ${{ matrix.cron-opts }}
        run: |
          . /etc/os-release
          sudo sh tools/apt-update.sh
          if [ "$COCKPIT" = backports ]; then set -- -t "$VERSION_CODENAME-backports"; else set --; fi
          sudo apt-get install -y --no-install-recommends "$@" cockpit-ws cockpit-bridge cockpit-system
          sudo apt-get install -y --no-install-recommends cron
          if [ -n "$CRON_OPTS" ]; then
            sudo mkdir -p /etc/systemd/system/cron.service.d
            printf '[Service]\nEnvironment="EXTRA_OPTS=%s"\n' "$CRON_OPTS" |
              sudo tee /etc/systemd/system/cron.service.d/options.conf > /dev/null
            sudo systemctl daemon-reload
          fi
          sudo systemctl restart cron
          args=$(ps -o args= -p "$(systemctl show -p MainPID --value cron)")
          echo "cron: $args"
          case "$args " in *" -P${CRON_OPTS:+ $CRON_OPTS} "*) ;; *) echo "::error::cron runs without its options"; exit 1;; esac
          sudo ln -sfn "$GITHUB_WORKSPACE/src" /usr/share/cockpit/cronjobs
          # The status for the Status Board as the package installs it; the test starts its unit.
          sudo install -D -m 755 status/cronjobs-status /usr/lib/cockpit-cronjobs/cronjobs-status
          sudo install -m 644 status/cockpit-cronjobs-status.service status/cockpit-cronjobs-status.timer /usr/lib/systemd/system/
          sudo systemctl daemon-reload
          dpkg-query -W cockpit-ws cockpit-bridge cron
      - name: Check tools (pinned in test/requirements.txt)
        run: |
          pip install -r test/requirements.txt
          echo "PLAYWRIGHT_BROWSERS_PATH=$HOME/.cache/ms-playwright" >> "$GITHUB_ENV"
      # Only the browser, two tries of four minutes (see the job test).
      - name: Browser (Chromium from Playwright's CDN, two tries)
        timeout-minutes: 10
        run: |
          for try in 1 2; do
            timeout --kill-after=10s 4m python -m playwright install chromium && exit 0
            echo "::warning::playwright install failed or hung (try $try)"
          done
          exit 1
      - name: Start Cockpit as root, without login
        run: |
          sudo /usr/lib/cockpit/cockpit-ws --no-tls --port 9091 --address 127.0.0.1 --local-session=cockpit-bridge \
            > "$RUNNER_TEMP/cockpit-ws.log" 2>&1 &
          for i in $(seq 100); do
            if (exec 3<>/dev/tcp/127.0.0.1/9091) 2>/dev/null; then exit 0; fi
            sleep 0.2
          done
          cat "$RUNNER_TEMP/cockpit-ws.log"
          exit 1
      - name: End-to-end test (as root)
        run: |
          sudo env PLAYWRIGHT_BROWSERS_PATH="$PLAYWRIGHT_BROWSERS_PATH" CRONJOBS_E2E_DESTRUCTIVE=1 \
            "$(command -v python)" test/e2e_cockpit.py
      - name: Logs
        if: failure()
        run: |
          cat "$RUNNER_TEMP/cockpit-ws.log" || true
          sudo journalctl -u cron --no-pager -n 50 || true
          sudo journalctl -u cockpit-cronjobs-status --no-pager -n 30 || true
          sudo crontab -l -u root || true
          sudo ls -laR /var/lib/cockpit-cronjobs || true
      - name: Keep screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-screenshots-${{ matrix.cockpit }}
          path: test/shots/

  # The same end-to-end test with cronie and the .rpm in a Rocky Linux VM with SELinux enforcing
  # (suite e2e; tools/vm.sh: the pinned cloud image under KVM on this runner). The test runs as root
  # in the machine against its Cockpit (port 9091, forwarded here); the browser stays on this
  # runner, behind a Playwright server bound to 127.0.0.1 that an SSH tunnel brings into the machine
  # (the server takes no other Host header). The job fails on every SELinux denial
  # between the mark after the set-up and the end of the test.
  # The same upgrade test as job upgrade (suite upgrade), with the .rpm of the previous release
  # first: its status unit has to fail there with an SELinux denial (systemd ran its helper in
  # init_t, which may not read crontabs, root's included); the mark comes after that, so the check
  # covers the upgrade, the new status unit, the runs cron records after it and the removal.
  # A pilot: not yet part of e2e.
  e2e-el:
    name: ${{ matrix.suite }} (${{ matrix.os }}, cronie, SELinux enforcing)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [rocky-9, rocky-10]
        suite: [e2e, upgrade]
        include:
          - { os: rocky-9, python: python3.12 }
          - { os: rocky-10, python: python3 }
    env:
      VM_PORTS: "9091"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: matrix.suite == 'e2e'
        with:
          python-version: "3.12"
      - name: The package of this build, QEMU and cloud-init's seed tool
        run: |
          sudo sh tools/apt-update.sh
          sudo apt-get install -y -qq --no-install-recommends rpm qemu-system-x86 qemu-utils cloud-image-utils > /dev/null
          make packages
      - name: Playwright (pinned in test/requirements.txt)
        if: matrix.suite == 'e2e'
        run: pip install -r test/requirements.txt
      # Only the browser, two tries of four minutes (see the job test).
      - name: Browser (Chromium from Playwright's CDN, two tries)
        if: matrix.suite == 'e2e'
        timeout-minutes: 10
        run: |
          for try in 1 2; do
            timeout --kill-after=10s 4m python -m playwright install chromium && exit 0
            echo "::warning::playwright install failed or hung (try $try)"
          done
          exit 1
      - name: KVM for the runner's user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules > /dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Which cloud image
        id: image
        env:
          OS: ${{ matrix.os }}
        run: echo "name=$(sh tools/vm.sh image "$OS")" >> "$GITHUB_OUTPUT"
      - name: The cloud image (kept between runs by its pinned name; tools/vm.sh checks its SHA-256)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/azentrius-vm
          key: vm-${{ steps.image.outputs.name }}
      - name: The .rpm of the previous release (test/e2e/release-asset.sh)
        if: matrix.suite == 'upgrade'
        run: sh test/e2e/release-asset.sh "$GITHUB_REPOSITORY" "$PREVIOUS_TAG" "$PREVIOUS_RPM" "$PREVIOUS_RPM_SHA256" previous
      - name: Boot ${{ matrix.os }} (tools/vm.sh)
        env:
          OS: ${{ matrix.os }}
        run: sh tools/vm.sh start "$OS"
      - name: Cockpit, cronie, the package, the test and Playwright for it in the machine
        if: matrix.suite == 'e2e'
        env:
          PY: ${{ matrix.python }}
        run: |
          sh tools/vm.sh root dnf install -y -q cockpit-ws cockpit-bridge cockpit-system cronie diffutils "$PY"
          sh tools/vm.sh root mkdir -p /root/cj
          tar -cf - src test/e2e_cockpit.py | sh tools/vm.sh root tar -C /root/cj -xf -
          sh tools/vm.sh copy /root/cj dist/*.rpm
          sh tools/vm.sh root sh -c "'dnf install -y -q /root/cj/cockpit-cronjobs-*.rpm && rpm -q cockpit-cronjobs cockpit-bridge cronie'"
          sh tools/vm.sh root systemctl enable --now crond
          sh tools/vm.sh root "$PY" -m venv /root/cj/venv
          sh tools/vm.sh root /root/cj/venv/bin/pip install -q "$(grep '^playwright==' test/requirements.txt)"
      # Installed by hand, so that removing the package does not take them along as dependencies.
      - name: cronie, Cockpit's bridge, the packages and the upgrade test in the machine
        if: matrix.suite == 'upgrade'
        run: |
          sh tools/vm.sh root dnf install -y -q cockpit-bridge cronie diffutils python3
          sh tools/vm.sh root systemctl enable --now crond
          sh tools/vm.sh copy /root/up dist/*.rpm test/e2e/upgrade.sh
          sh tools/vm.sh copy /root/up/previous "previous/$PREVIOUS_RPM"
      # cockpit-ws from a copy (bin_t): the original's label would take it into the web server's
      # confined domain, which may not run a bridge as root. This way the bridge runs as root in the
      # caller's domain, as an administrator's does after a login.
      - name: Cockpit in the machine as root, without login, and the Playwright server here
        if: matrix.suite == 'e2e'
        run: |
          sh tools/vm.sh root install -m 755 /usr/libexec/cockpit-ws /usr/local/bin/cockpit-ws-e2e
          sh tools/vm.sh root sh -c "'systemctl is-active --quiet firewalld && firewall-cmd -q --add-port=9091/tcp || true'"
          sh tools/vm.sh root sh -c "'setsid nohup /usr/local/bin/cockpit-ws-e2e --no-tls --port 9091 --address 0.0.0.0 --local-session=cockpit-bridge > /root/cj/cockpit-ws.log 2>&1 < /dev/null &'"
          url=http://127.0.0.1:9091/cockpit/@localhost/cronjobs/index.html
          for _ in $(seq 1 50); do curl -fsS -o /dev/null "$url" && break; sleep 1; done
          curl -fsS -o /dev/null "$url"
          nohup python -m playwright run-server --port 3333 --host 127.0.0.1 > "$RUNNER_TEMP/playwright-server.log" 2>&1 &
          up=0
          for _ in $(seq 1 50); do
            if (exec 3<>/dev/tcp/127.0.0.1/3333) 2> /dev/null; then up=1; break; fi
            sleep 0.2
          done
          if [ "$up" != 1 ]; then cat "$RUNNER_TEMP/playwright-server.log"; exit 1; fi
          sh tools/vm.sh back 3333
      - name: The SELinux check catches a denial on purpose; then the mark in the audit log
        if: matrix.suite == 'e2e'
        run: |
          sh tools/vm.sh avc-selftest
          sh tools/vm.sh avc-mark
      - name: End-to-end test in the machine (as root)
        if: matrix.suite == 'e2e'
        run: |
          sh tools/vm.sh root sh -c "'cd /root/cj && PLAYWRIGHT_WS=ws://127.0.0.1:3333/ CRONJOBS_E2E_DESTRUCTIVE=1 venv/bin/python test/e2e_cockpit.py'"
      - name: The SELinux check catches a denial on purpose
        if: matrix.suite == 'upgrade'
        run: sh tools/vm.sh avc-selftest
      - name: The previous release, set up as on its page, and its status unit (test/e2e/upgrade.sh old)
        if: matrix.suite == 'upgrade'
        run: sh tools/vm.sh root sh -c "'cd /root/up && OUT=/root/up/session sh upgrade.sh old /root/up/previous/$PREVIOUS_RPM'"
      - name: The mark in the audit log, after the denials of the previous release
        if: matrix.suite == 'upgrade'
        run: sh tools/vm.sh avc-mark
      - name: This build over it (test/e2e/upgrade.sh new)
        if: matrix.suite == 'upgrade'
        run: sh tools/vm.sh root sh -c "'cd /root/up && OUT=/root/up/session sh upgrade.sh new /root/up/cockpit-cronjobs-*.rpm'"
      - name: The package removed (test/e2e/upgrade.sh remove)
        if: matrix.suite == 'upgrade'
        run: sh tools/vm.sh root sh -c "'cd /root/up && OUT=/root/up/session sh upgrade.sh remove'"
      - name: No SELinux denials during the test
        run: sh tools/vm.sh avc-check
      - name: Logs
        if: always()
        env:
          OS: ${{ matrix.os }}
          SUITE: ${{ matrix.suite }}
        run: |
          mkdir -p e2e-el
          if [ "$SUITE" = upgrade ]; then
            sh tools/vm.sh fetch e2e-el /root/up/session || true
            if [ -f e2e-el/root/up/session/report.md ]; then
              { echo "### upgrade, $OS"; cat e2e-el/root/up/session/report.md; } >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            sh tools/vm.sh fetch e2e-el /root/cj/test/shots /root/cj/cockpit-ws.log || true
          fi
          sh tools/vm.sh root journalctl -u crond --no-pager -n 200 > e2e-el/crond.txt 2>&1 || true
          sh tools/vm.sh logs e2e-el || true
          cp "$RUNNER_TEMP/playwright-server.log" e2e-el/ 2> /dev/null || true
      - name: Keep the screenshots and the logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.suite }}-${{ matrix.os }}
          path: e2e-el/

  # The required check: green only when the end-to-end test passed with both. It runs even when
  # one of them failed, since a check that is skipped would count as passed.
  e2e:
    needs: e2e-cockpit
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: End-to-end test with both
        env:
          RESULT: ${{ needs.e2e-cockpit.result }}
        run: |
          echo "e2e-cockpit: $RESULT"
          test "$RESULT" = success
