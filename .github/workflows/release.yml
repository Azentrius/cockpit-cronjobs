# Makes a release on request: Actions › release › Run workflow (on main).
# Checks the version, runs all tests, builds the package and creates the tag
# vVERSION with a GitHub release (package, SHA256SUMS, notes from CHANGELOG.md).
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 2.1.1 (empty: the VERSION in src/app.js)"
        required: false
        default: ""
      prerelease:
        description: "Mark as pre-release"
        type: boolean
        default: false

permissions:
  contents: write       # tag and release
  id-token: write       # signing the build provenance
  attestations: write   # storing the build provenance

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Only from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releases are made from main only (this run: $GITHUB_REF)."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          code=$(sed -n 's/^ *const VERSION = "\(.*\)";/\1/p' src/app.js)
          version=${INPUT_VERSION:-$code}
          version=${version#v}
          if ! printf '%s\n' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::\"$version\" is not a version like 2.1.1."
            exit 1
          fi
          if [ "$version" != "$code" ]; then
            echo "::error::Version $version differs from VERSION in src/app.js ($code). Change src/app.js first."
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
            echo "::error::Tag v$version exists already."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Unit tests
        run: make check
      - name: Install Playwright
        run: |
          pip install -r test/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Browser tests
        run: make check-ui

      - name: Package
        run: make package

      - name: Build provenance for the package
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: cockpit-cronjobs-${{ steps.version.outputs.version }}.tar.gz

      - name: Release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if tools/release-notes.sh "$VERSION" > notes.md; then
            echo "Notes from CHANGELOG.md"
          else
            echo "::warning::CHANGELOG.md has no section for $VERSION; GitHub writes the notes."
            : > notes.md
          fi
          {
            echo
            echo "### Install"
            echo
            echo '```sh'
            echo "curl -LO https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/cockpit-cronjobs-$VERSION.tar.gz"
            echo "curl -LO https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/SHA256SUMS"
            echo "sha256sum --ignore-missing -c SHA256SUMS"
            echo "sudo tar -xzf cockpit-cronjobs-$VERSION.tar.gz -C /usr/share/cockpit"
            echo '```'
            echo
            echo "Check that the archive was built by this repository's release workflow:"
            echo
            echo '```sh'
            echo "gh attestation verify cockpit-cronjobs-$VERSION.tar.gz --repo $GITHUB_REPOSITORY"
            echo '```'
          } >> notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -- --target "$GITHUB_SHA" --title "Cron Jobs $VERSION" --notes-file notes.md
          if [ ! -s CHANGELOG.md ] || ! tools/release-notes.sh "$VERSION" > /dev/null; then
            set -- "$@" --generate-notes
          fi
          if [ "$PRERELEASE" = "true" ]; then
            set -- "$@" --prerelease
          fi
          gh release create "v$VERSION" "cockpit-cronjobs-$VERSION.tar.gz" SHA256SUMS "$@"
